spring.application.name=core-api
server.port=${PORT:8080}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

noa.project-id=${GOOGLE_CLOUD_PROJECT:local-project}
noa.region=asia-southeast1
noa.firestore-emulator-host=${FIRESTORE_EMULATOR_HOST:}
noa.respond-agent.url=${RESPOND_AGENT_URL:http://localhost:8081}
noa.respond-agent.auth=${RESPOND_AGENT_AUTH:false}
noa.tasks.enabled=${TASKS_ENABLED:false}
noa.tasks.queue=escalation
noa.tasks.target-url=${CORE_API_URL:http://localhost:8080}
noa.tasks.invoker-email=${INVOKER_EMAIL:}
noa.pubsub.enabled=${PUBSUB_ENABLED:false}
noa.pubsub.topic=alerts
noa.audio.enabled=${AUDIO_ENABLED:false}
noa.audio.bucket=${AUDIO_BUCKET:}
noa.maps.api-key=${MAPS_API_KEY:}
noa.auth.enabled=${AUTH_ENABLED:false}
noa.auth.audience=${CORE_API_URL:http://localhost:8080}
noa.auth.invoker-email=${INVOKER_EMAIL:}
