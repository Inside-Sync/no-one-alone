name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: all, core-api, respond, hospital or web
        default: all

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-dev
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      sha: ${{ steps.targets.outputs.sha }}
      advance: ${{ steps.targets.outputs.advance }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 0
      - name: Pick targets
        id: targets
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          TARGET: ${{ inputs.target }}
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "list=$TARGET" >> "$GITHUB_OUTPUT"
            [ "$TARGET" = "all" ] && advance=true || advance=false
            echo "advance=$advance" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch origin +refs/deploy/dev:refs/deploy/dev || true
          base=$(git rev-parse -q --verify 'refs/deploy/dev^{commit}' || true)
          bash infra/pick-targets.sh "$base" HEAD | tee -a "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        if: steps.targets.outputs.list != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.targets.outputs.list != ''
      - uses: actions/setup-node@v4
        if: (contains(steps.targets.outputs.list, 'web') || contains(steps.targets.outputs.list, 'all')) && hashFiles('web/package.json') != ''
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        if: (contains(steps.targets.outputs.list, 'web') || contains(steps.targets.outputs.list, 'all')) && hashFiles('web/package.json') != ''
        working-directory: web
        # Web config is public by design (contract section 6); mock mode stays the local default.
        env:
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
          VITE_NOA_AI: ${{ vars.VITE_NOA_AI }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.GCP_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.GCP_PROJECT_ID }}.firebasestorage.app
        run: |
          npm ci
          npm run build
          npm install -g firebase-tools
      - name: Deploy
        if: steps.targets.outputs.list != ''
        shell: pwsh
        run: |
          $auth = if ("${{ vars.AUTH_ENABLED }}" -eq "true") { @{ AuthEnabled = $true } } else { @{} }
          foreach ($t in "${{ steps.targets.outputs.list }}".Split(" ", [StringSplitOptions]::RemoveEmptyEntries)) {
            ./infra/deploy.ps1 -ProjectId "${{ vars.GCP_PROJECT_ID }}" -Target $t @auth
          }

  mark:
    needs: deploy
    if: needs.deploy.result == 'success' && needs.deploy.outputs.advance == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      SHA: ${{ needs.deploy.outputs.sha }}
    steps:
      - name: Move refs/deploy/dev to the deployed commit
        shell: bash
        run: |
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/deploy/dev" -f sha="$SHA" -F force=true \
            || gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref=refs/deploy/dev -f sha="$SHA"
