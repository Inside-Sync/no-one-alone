name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:
    inputs:
      target:
        description: all, core-api, respond, hospital or web
        default: all

concurrency:
  group: deploy-dev
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2
      - name: Pick targets
        id: targets
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "list=${{ inputs.target }}" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only HEAD~1 HEAD)
          list=""
          echo "$changed" | grep -q '^agents/respond/' && list="$list respond"
          echo "$changed" | grep -q '^agents/hospital/' && list="$list hospital"
          echo "$changed" | grep -q '^core-api/' && list="$list core-api"
          if [ -f web/package.json ]; then
            echo "$changed" | grep -qE '^(web/|firebase.json|firestore.rules|storage.rules)' && list="$list web"
          fi
          echo "list=$list" >> "$GITHUB_OUTPUT"
      - uses: google-github-actions/auth@v2
        if: steps.targets.outputs.list != ''
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOY_SA }}
      - uses: google-github-actions/setup-gcloud@v2
        if: steps.targets.outputs.list != ''
      - uses: actions/setup-node@v4
        if: (contains(steps.targets.outputs.list, 'web') || contains(steps.targets.outputs.list, 'all')) && hashFiles('web/package.json') != ''
        with:
          node-version-file: web/.nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build web
        if: (contains(steps.targets.outputs.list, 'web') || contains(steps.targets.outputs.list, 'all')) && hashFiles('web/package.json') != ''
        working-directory: web
        # Web config is public by design (contract section 6); mock mode stays the local default.
        env:
          VITE_DATA_SOURCE: ${{ vars.VITE_DATA_SOURCE }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.GCP_PROJECT_ID }}.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.GCP_PROJECT_ID }}.firebasestorage.app
        run: |
          npm ci
          npm run build
          npm install -g firebase-tools
      - name: Deploy
        if: steps.targets.outputs.list != ''
        shell: pwsh
        run: |
          $auth = if ("${{ vars.AUTH_ENABLED }}" -eq "true") { @{ AuthEnabled = $true } } else { @{} }
          foreach ($t in "${{ steps.targets.outputs.list }}".Split(" ", [StringSplitOptions]::RemoveEmptyEntries)) {
            ./infra/deploy.ps1 -ProjectId "${{ vars.GCP_PROJECT_ID }}" -Target $t @auth
          }
